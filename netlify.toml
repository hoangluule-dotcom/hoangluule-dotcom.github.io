[build]
  publish = "."
  # Bắt buộc phải có command này, nếu không Netlify sẽ bỏ qua bước cài
  # dependency và function lead-status.js không tìm thấy @netlify/blobs.
  command = "npm install"

[build.processing]
  skip_processing = false

# ── Chặn tệp nội bộ ─────────────────────────────────────────────────────────
# Netlify đưa MỌI tệp trong thư mục này lên internet, không chỉ trang web.
# Tài liệu hướng dẫn và script nội bộ đã được chuyển ra ngoài thư mục deploy,
# nhưng giữ các luật dưới đây làm lớp chặn dự phòng — lỡ tay để sót một tệp
# thì nó bị trả 404 thay vì phơi ra cho ai cũng đọc được.
[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.py"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Bỏ qua secret scanning cho file Google Maps (key được restrict theo domain)
[secrets]
  [[secrets.ignored_files]]
    path = "servicemap.html"

# Bỏ qua scanning cho các env vars dùng process.env (không hardcode trong source)
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "DASHBOARD_KEY,NETLIFY_ACCESS_TOKEN,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyC85LOYsngItz49WJYalPzgSCGzXS-rU8E"
