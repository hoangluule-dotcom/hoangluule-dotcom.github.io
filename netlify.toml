[build]
  publish = "."
  # Bắt buộc phải có command này, nếu không Netlify sẽ bỏ qua bước cài
  # dependency và function lead-status.js không tìm thấy @netlify/blobs.
  command = "npm install"

[build.processing]
  skip_processing = false

# ── Quét giá thị trường xe cũ ───────────────────────────────────────────────
# Chạy MỖI GIỜ, mỗi lượt chỉ quét 10 cặp (dòng xe × năm).
#
# Vì sao lô nhỏ chạy dày thay vì lô lớn chạy tuần: scheduled function của
# Netlify bị cắt sau 30 GIÂY. Quét 120 mục một lượt là chắc chắn bị giết giữa
# chừng — ghi được vài mục rồi chết, mà không có lỗi nào hiện ra ngoài.
#
# 24 lượt/ngày × 10 mục = 240 mục/ngày, phủ hết 780 cặp trong ~3,5 ngày.
# Dữ liệu tươi hơn bản quét tuần, và không lượt nào chạm giới hạn 30 giây.
#
# Lưu ý: KHÔNG gọi hàm này bằng URL được — Netlify chặn scheduled function.
# Muốn chạy tay: Netlify > Functions > gia-thi-truong-cron > nút "Run now".
[functions."gia-thi-truong-cron"]
  schedule = "0 * * * *"

# ── Chặn tệp nội bộ ─────────────────────────────────────────────────────────
# Netlify đưa MỌI tệp trong thư mục này lên internet, không chỉ trang web.
# Tài liệu hướng dẫn và script nội bộ đã được chuyển ra ngoài thư mục deploy,
# nhưng giữ các luật dưới đây làm lớp chặn dự phòng — lỡ tay để sót một tệp
# thì nó bị trả 404 thay vì phơi ra cho ai cũng đọc được.
[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.py"
  to = "/404.html"
  status = 404
  force = true

# Thư mục scripts nằm trong repo để GitHub Actions chạy được, nhưng không có
# lý do gì để nó xuất hiện trên internet.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── Cache tài nguyên tĩnh ───────────────────────────────────────────────────
# Ảnh, font, JS, CSS gần như không đổi → cho trình duyệt giữ lại 1 năm.
# Giúp khách xem trang thứ hai trở đi tải gần như tức thì, và cải thiện
# chỉ số Core Web Vitals (LCP) mà Google dùng để xếp hạng.
# Khi cần thay ảnh: đổi tên file (vd banner-hero-v2.webp) thay vì ghi đè.
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML phải luôn kiểm tra bản mới — nếu cache lâu, khách sẽ thấy nội dung cũ
# sau mỗi lần deploy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# sitemap và robots: cache ngắn để Google luôn thấy bản mới nhất
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Bỏ qua secret scanning cho file Google Maps (key được restrict theo domain)
[secrets]
  [[secrets.ignored_files]]
    path = "servicemap.html"

# Bỏ qua scanning cho các env vars dùng process.env (không hardcode trong source)
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "DASHBOARD_KEY,NETLIFY_ACCESS_TOKEN,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyC85LOYsngItz49WJYalPzgSCGzXS-rU8E"
